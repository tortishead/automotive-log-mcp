[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "automotive-log-mcp"
version = "0.1.0"
description = "MCP server for defect analysis on automotive logs, with every finding cited to a log line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
    "starlette>=0.40",  # serve --http (already required by mcp; imported directly)
    "uvicorn>=0.30",
    "tzdata; sys_platform == 'win32'",  # zoneinfo data for dropbox times (Windows has none)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "types-PyYAML",
]

[project.scripts]
automotive-log-mcp = "automotive_log_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automotive_log_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×"]  # the collapse count in tool output

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # log lines and regexes as test data

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["automotive_log_mcp"]

[[tool.mypy.overrides]]
module = ["mcp.*", "mcp_types.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not perf'"
markers = ["perf: performance test on a generated large log (run with -m perf)"]

# Evaluation cases (implementation plan, M4 item 6).
#
# Each case is a closed defect: the log files, the symptom as the defect report states it, and the
# expected answer: the component at fault and the root-cause citations. Write the expected answer
# BEFORE any run (tool-level or agent) and judge it against the fix commit, not against what the
# tools happen to show. Citations depend on the order sources are indexed, so `files` are indexed
# in the order listed, into a fresh case named after `id`.
#
# The cases in this file are SYNTHETIC: built from the test fixtures and the logs in synthetic/,
# with the expected citations taken from how those logs were written. They keep the harness
# honest in CI; they say nothing about real defects. Put real defects in cases.local.yaml (same
# format, git-ignored; see eval/README.md) and run both files.
#
# Fields:
#   id         case name: letters, digits, '.', '_', '-' (also the case DB name)
#   synthetic  true for made-up cases (runs in CI)
#   title, symptom
#   files      paths relative to this file, or absolute
#   expected:
#     component    what was at fault (process, service, module), as the fix commit shows it
#     root_cause   one or two sentences
#     citations    the lines that show the root cause: log:<source>#<seq> or art:<id>[/section][:L<n>],
#                  each optionally with the text the line must contain ({cite: …, text: …}): the
#                  harness checks it, which catches citations that drifted (reindex, miscount)
#     order        optional: citations on different clocks in the order they happened; the harness
#                  checks that the case clock (timeline, alignment) puts them in this order
#   queries    optional: queries a reasonable engineer would run first, beyond detect and
#              list_artifacts (tool + args, as the MCP tools take them); counted in evidence recall
#   fix        the fix commit (or "synthetic")

version: 1
cases:
  - id: syn-hvac-crash
    synthetic: true
    title: HVAC app closes when the temperature is changed
    symptom: The climate app disappears when the driver sets the temperature; it reopens on the next tap.
    files: [synthetic/bugreport-sdk_car-UAA1.250512.001-2026-01-01-00-10-00.zip]
    expected:
      component: com.example.hvac (HvacCtrl, Controller.update)
      root_cause: >-
        setProperty for the temperature fails with NOT_AVAILABLE and the app does not handle it:
        Controller.update dereferences the missing value (NullPointerException) and the app crashes.
      citations:
        - {cite: log:1#2, text: "setProperty failed, status=NOT_AVAILABLE"}
        - {cite: art:1/exception:L3, text: "java.lang.NullPointerException"}
    queries:
      - {tool: search, args: {query: hvac, filter: {level: W}}}
    fix: synthetic

  - id: syn-radio-anr
    synthetic: true
    title: Radio freezes when tuning
    symptom: The radio app stops responding for several seconds after a station button is pressed.
    files: [synthetic/bugreport-sdk_car-UAA1.250512.001-2026-01-01-00-10-00.zip]
    expected:
      component: com.example.radio (Tuner holds its lock across a binder call to system_server)
      root_cause: >-
        RadioWorker holds the Tuner lock while it calls ICarProperty.setProperty in system_server;
        the main thread blocks on that lock in Tuner.tune and the broadcast times out (ANR).
      citations:
        - {cite: art:2/p1500.t1.main:L12, text: "waiting to lock <0x0a1b2c3d>"}
        - {cite: art:2/p1500.t12.radioworker:L23, text: "ICarProperty$Stub$Proxy.setProperty"}
    fix: synthetic

  - id: syn-vhal-abort
    synthetic: true
    title: Climate unavailable after a temperature change
    symptom: After setting 22 degrees the climate screen shows 'Climate unavailable' for a few seconds.
    files: [synthetic/vhal-abort.log]
    expected:
      component: vehicle HAL (vendor.vehicle-hal-default, HVAC bus handling in HvacBus.cpp)
      root_cause: >-
        The HVAC bus write times out and the VHAL aborts on a failed check in onBusTimeout instead of
        returning an error; the VHAL restarts and the property call fails meanwhile.
      citations:
        - {cite: log:1#15, text: "HVAC bus write failed"}
        - {cite: log:1#16, text: "Check failed: pendingRequests.empty()"}
    fix: synthetic

  - id: syn-lmk-media
    synthetic: true
    title: Music stops during navigation
    symptom: Media playback stops after a few minutes of route guidance and restarts by itself.
    files: [synthetic/lmk-media.log]
    expected:
      component: com.example.nav (heap growth, tile cache)
      root_cause: >-
        The navigation app's heap grows to its limit; under memory pressure lmkd kills the media app
        (higher oom_score_adj), which is then restarted.
      citations:
        - {cite: log:1#11, text: "Clamp target GC heap"}
        - {cite: log:1#12, text: "Kill 'com.example.media'"}
    queries:
      - {tool: search, args: {query: heap, filter: {pid: 3456}}}
    fix: synthetic

  - id: syn-boot-selinux
    synthetic: true
    title: CarService does not start after a vendor update
    symptom: After flashing the new vendor image the head unit stays on the boot animation.
    files: [synthetic/boot-selinux.log]
    expected:
      component: vendor.hvac-daemon (hvacd) SELinux policy / labelling of /dev/vehicle_bus0
      root_cause: >-
        hvacd may not open /dev/vehicle_bus0 (the node is labelled 'device', so the enforced policy
        denies read/write); the daemon exits and restarts in a loop and CarService waits for its HAL.
      citations:
        - {cite: log:1#4, text: "open /dev/vehicle_bus0 failed: Permission denied"}
        - {cite: log:1#5, text: "avc: denied { read write }"}
    fix: synthetic

  # -- M6 (Nov 10, 2026): five more synthetic cases, expected answers written before the first run --

  - id: syn-can-busoff
    synthetic: true
    title: Speed shows '--' on the cluster while driving
    symptom: For about a second the cluster shows '--' instead of the vehicle speed; it comes back by itself.
    files: [synthetic/can-busoff/hu-logcat.txt, synthetic/can-busoff/dmesg.txt]
    expected:
      component: CAN controller can0 (flexcan driver) going bus-off; VHAL only reports the missing frames
      root_cause: >-
        The CAN controller goes bus-off and drops its tx queue 250 ms before the VHAL notices that the
        speed frame 0x3A1 is missing; the kernel log (seconds since boot) has the cause, the head unit's
        logcat (wall clock) the symptom, so the two must be put on one clock to see the order.
      citations:
        - {cite: log:2#6, text: "can0: bus-off, stopping controller"}
        - {cite: log:1#6, text: "CAN rx timeout on can0"}
      order: [log:2#6, log:1#6]
    queries:
      - {tool: timeline, args: {filter: {from: "log:1#6-1s", to: "log:1#6"}}}
    fix: synthetic

  - id: syn-watchdog-audio
    synthetic: true
    title: Head unit restarts when the audio system is switched on
    symptom: Pressing the audio button freezes the screen for half a minute, then the head unit restarts.
    files: [synthetic/watchdog-audio.log]
    expected:
      component: audio HAL (audio_hw, pcm_open of card 0 device 3) blocking system_server's main thread
      root_cause: >-
        CarAudioService calls AudioSystem.setParameters on system_server's main thread; the audio HAL holds
        its stream lock while pcm_open fails and retries, so the call blocks and the watchdog kills
        system_server.
      citations:
        - {cite: log:1#4, text: "pcm_open card 0 device 3 failed: I/O error"}
        - {cite: log:1#8, text: "Blocked in handler on main thread (main)"}
    queries:
      - {tool: search, args: {query: audio, filter: {level: W}}}
    fix: synthetic

  - id: syn-evs-crash
    synthetic: true
    title: Rear camera image disappears when reversing
    symptom: Shifting into reverse shows the rear view for a moment, then a 'camera unavailable' message.
    files: [synthetic/evs-crash/evs.log, synthetic/evs-crash/tombstone_03]
    expected:
      component: EVS camera HAL (libevs_v4l2.so, V4l2Stream::dequeue)
      root_cause: >-
        The camera's deserializer link drops and VIDIOC_DQBUF fails with ENODEV; V4l2Stream::dequeue does
        not handle the failure and dereferences a null buffer (SIGSEGV), so the EVS HAL dies.
      citations:
        - {cite: log:1#5, text: "VIDIOC_DQBUF failed: No such device"}
        - {cite: art:1/backtrace:L16, text: "V4l2Stream::dequeue"}
    queries:
      - {tool: search, args: {query: evs, filter: {level: W}}}
    fix: synthetic

  - id: syn-wifi-fw-ota
    synthetic: true
    title: No Wi-Fi after the software update
    symptom: After the OTA update and its reboot the head unit shows no Wi-Fi networks; before it worked.
    files: [synthetic/wifi-fw-ota.dmesg]
    expected:
      component: Wi-Fi driver firmware (qca6390/wlanfw20.mbn missing from the updated image)
      root_cause: >-
        In the boot after the update the wlan driver cannot load its firmware file (ENOENT), the PCI probe
        fails and the Wi-Fi HAL exits; the boot before the update loaded the same firmware.
      citations:
        - {cite: log:1#15, text: "firmware request failed for qca6390/wlanfw20.mbn"}
        - {cite: log:1#16, text: "probe of 0000:01:00.0 failed"}
    queries:
      - {tool: diff, args: {a: {sources: ["1"], seg: 1}, b: {sources: ["1"], seg: 2}}}
    fix: synthetic

  - id: syn-bt-restart
    synthetic: true
    title: Bluetooth cannot be switched on
    symptom: The Bluetooth toggle stays off; phones do not find the car.
    files: [synthetic/bt-restart.log]
    expected:
      component: Bluetooth HAL (vendor.bluetooth-1-1), firmware patch BCM4359C0.hcd missing
      root_cause: >-
        The Bluetooth vendor library cannot find the chip's firmware patch, the HCI reset after the
        download times out and the HAL exits; init restarts it four times and the framework gives up.
      citations:
        - {cite: log:1#3, text: "firmware patch /vendor/firmware/BCM4359C0.hcd not found"}
        - {cite: log:1#5, text: "Service 'vendor.bluetooth-1-1' (pid 1301) exited with status 1"}
    queries:
      - {tool: search, args: {query: bluetooth, filter: {level: W}}}
    fix: synthetic
